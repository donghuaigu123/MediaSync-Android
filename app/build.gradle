plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.mediasync.app'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.mediasync.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        resConfigs 'zh'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
